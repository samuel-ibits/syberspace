<svg width="32" height="32" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="44" height="44" rx="10" fill="#0a0f1e"/>

  <!-- Monitor shell -->
  <rect x="3" y="3" width="38" height="26" rx="3.5" stroke="url(#g1)" stroke-width="2" fill="none"/>
  <!-- Screen glow -->
  <rect x="5" y="5" width="34" height="22" rx="2" fill="url(#g2)" opacity="0.5"/>

  <!-- Stand neck -->
  <rect x="19.5" y="29" width="5" height="5" rx="1" fill="url(#g1)"/>
  <!-- Stand base -->
  <rect x="13" y="34" width="18" height="3" rx="1.5" fill="url(#g1)"/>

  <!-- Chart line -->
  <polyline
    points="8,21 12,16 17,18 21,12 26,14 31,9 36,11"
    stroke="url(#g1)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Chart dots -->
  <circle cx="8"  cy="21" r="1.6" fill="#00d4ff"/>
  <circle cx="17" cy="18" r="1.6" fill="#5b8fff"/>
  <circle cx="21" cy="12" r="1.6" fill="#7c3aed"/>
  <circle cx="31" cy="9"  r="1.6" fill="#00d4ff"/>
  <circle cx="36" cy="11" r="1.6" fill="#00d4ff"/>
</svg>
