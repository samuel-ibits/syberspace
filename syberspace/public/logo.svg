<svg width="220" height="48" viewBox="0 0 220 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Monitor shell -->
  <rect x="2" y="2" width="40" height="28" rx="3.5" stroke="url(#screenGrad)" stroke-width="2" fill="none"/>
  <!-- Screen fill -->
  <rect x="4" y="4" width="36" height="24" rx="2" fill="url(#glowGrad)" opacity="0.4"/>
  <!-- Stand neck -->
  <rect x="19" y="30" width="6" height="5" rx="1" fill="url(#screenGrad)"/>
  <!-- Stand base -->
  <rect x="13" y="35" width="18" height="3" rx="1.5" fill="url(#screenGrad)"/>

  <!-- Chart line inside screen (refined analytics graph) -->
  <polyline
    points="8,22 13,17 18,19 23,13 28,15 33,10 38,12"
    stroke="url(#screenGrad)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    filter="url(#glow)"
  />
  <!-- Chart dots -->
  <circle cx="8"  cy="22" r="1.5" fill="#00d4ff"/>
  <circle cx="18" cy="19" r="1.5" fill="#5b8fff"/>
  <circle cx="23" cy="13" r="1.5" fill="#7c3aed"/>
  <circle cx="33" cy="10" r="1.5" fill="#00d4ff"/>
  <circle cx="38" cy="12" r="1.5" fill="#00d4ff" filter="url(#glow)"/>

  <!-- Wordmark -->
  <text x="52" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="white">Syber</text>
  <text x="113" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5" fill="url(#screenGrad)">space</text>
</svg>
